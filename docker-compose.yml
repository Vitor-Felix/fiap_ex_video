services:
  # 1. Banco de Dados PostgreSQL
  database:
    image: postgres:16-alpine
    container_name: fiap_postgres
    environment:
      POSTGRES_USER: fiap_user
      POSTGRES_PASSWORD: fiap_password
      POSTGRES_DB: fiap_x_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiap_user -d fiap_x_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ
  rabbitmq:
    image: rabbitmq:4-management
    container_name: fiap_rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: fiap
      RABBITMQ_DEFAULT_PASS: fiap
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Backend Go (API)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiap_api
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=fiap_user
      - DB_PASSWORD=fiap_password
      - DB_NAME=fiap_x_db
      - RABBITMQ_URL=amqp://fiap:fiap@rabbitmq:5672/
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared_uploads:/app/uploads
      - shared_outputs:/app/outputs
      - shared_temp:/app/temp

  # 4. API Gateway (Nginx)
  gateway:
    image: nginx:alpine
    container_name: fiap_gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  # 5. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: fiap_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  # 6. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: fiap_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # 7. Worker Consumidor (Python)
  fiap_worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: fiap_worker
    ports:
      - "8000:8000"
    env_file:
      - .env            # carrega SMTP_* do arquivo local (não vai ao repo)
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=fiap_x_db
      - DB_USER=fiap_user
      - DB_PASSWORD=fiap_password
      - RABBITMQ_URL=amqp://fiap:fiap@rabbitmq:5672/
    volumes:
      - shared_uploads:/app/uploads
      - shared_outputs:/app/outputs
      - shared_temp:/app/temp
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
    driver: local

  rabbitmq_data:
    driver: local

  shared_uploads:
    driver: local

  shared_outputs:
    driver: local

  shared_temp:
    driver: local

  prometheus_data:
    driver: local

  grafana_data:
    driver: local
