name: FIAP X - CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  # ============================================================
  # JOB 1: Go — Lint + Testes
  # ============================================================
  go-lint-and-test:
    name: Lint & Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        go-version: ['1.25'] # Versão estável atual para Hackathon

    steps:
      # 1. Checkout do código
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup do Go (cache automático de módulos)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: src/go.sum

      # 3. Linting Estático (análogo ao flake8 do Python)
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: src
          args: --timeout=3m --verbose

      # 4. Testes Unitários com Race Detector
      - name: Run Unit Tests
        working-directory: src
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic

      # 5. Exibir Cobertura de Testes no Console
      - name: Coverage Report
        working-directory: src
        run: go tool cover -func=coverage.out

      # 6. Upload do coverage para análise posterior
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: src/coverage.out

  # ============================================================
  # JOB 2: Python (Worker) — Lint + Testes
  # ============================================================
  python-lint-and-test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout do código
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup do Python 3.12 (alinhado com o container do worker)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      # 3. Instala dependências de produção + ferramentas de qualidade
      #    psycopg2-binary requer libpq-dev para compilar no ubuntu
      - name: Install dependencies
        run: |
          sudo apt-get install -y libpq-dev --no-install-recommends
          pip install -r worker/requirements.txt
          pip install flake8==7.1.1

      # 4. Lint com flake8
      #    - E501: ignora linhas longas (> 79 chars) para não bloquear o CI por estilo
      #    - W503: ignora quebra de linha antes de operador binário (conflita com Black)
      - name: Run flake8
        working-directory: worker
        run: |
          flake8 . \
            --exclude=__pycache__,tests/__pycache__ \
            --max-line-length=120 \
            --extend-ignore=W503 \
            --statistics

      # 5. Testes unitários com unittest (sem dependência de pytest)
      #    psycopg2 é mockado dentro dos testes; não precisa de banco real
      - name: Run Unit Tests
        working-directory: worker
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
