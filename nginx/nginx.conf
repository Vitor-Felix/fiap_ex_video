events {
    worker_connections 1024;
}

http {
    # ==========================================================
    # Rate Limiting
    # Cria uma zona de memória compartilhada de 10MB chamada "api",
    # indexada pelo IP do cliente, com limite de 10 requisições/segundo.
    # ==========================================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Suporte a uploads de vídeos maiores
    client_max_body_size 500M;

    server {
        listen 8080;

        # ==========================================================
        # Security Headers
        # Injetados pelo gateway em TODAS as respostas — a API Go
        # não precisa saber da existência deles.
        # ==========================================================
        add_header X-Frame-Options       "SAMEORIGIN"       always;
        add_header X-Content-Type-Options "nosniff"         always;
        add_header X-XSS-Protection      "1; mode=block"   always;
        add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

        # ==========================================================
        # Rotas públicas — rate limit relaxado (burst de 20)
        # ==========================================================
        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api-service:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================================
        # Rota de upload — rate limit mais restrito (burst de 5)
        # Evita flood de uploads que saturaria o processamento.
        # ==========================================================
        location /upload {
            limit_req zone=api burst=5 nodelay;

            # Desativa buffering para não travar uploads grandes em memória
            proxy_request_buffering off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;

            proxy_pass http://api-service:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
