apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiap-api
  template:
    metadata:
      labels:
        app: fiap-api
    spec:
      containers:
      - name: api
        image: fiap-api:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: fiap-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: JWT_SECRET
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: RABBITMQ_URL
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: shared-storage
          mountPath: /app/uploads
          subPath: uploads
        - name: shared-storage
          mountPath: /app/outputs
          subPath: outputs
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: fiap-api
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
