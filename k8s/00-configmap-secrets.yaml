apiVersion: v1
kind: ConfigMap
metadata:
  name: fiap-config
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "fiap_x_db"
  DB_USER: "fiap_user"
---
apiVersion: v1
kind: Secret
metadata:
  name: fiap-secrets
type: Opaque
stringData:
  DB_PASSWORD: "fiap_password"
  RABBITMQ_USER: "fiap"
  RABBITMQ_PASS: "fiap"
  RABBITMQ_URL: "amqp://fiap:fiap@rabbitmq-service:5672/"
  JWT_SECRET: "fiap_x_super_secret_jwt_key_2026"
  