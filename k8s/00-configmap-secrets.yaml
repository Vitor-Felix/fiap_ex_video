apiVersion: v1
kind: ConfigMap
metadata:
  name: fiap-config
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "fiap_x_db"
  DB_USER: "fiap_user"
---
apiVersion: v1
kind: Secret
metadata:
  name: fiap-secrets
type: Opaque
stringData:
  DB_PASSWORD: "fiap_password"
  RABBITMQ_USER: "fiap"
  RABBITMQ_PASS: "fiap"
  RABBITMQ_URL: "amqp://fiap:fiap@rabbitmq-service:5672/"
  JWT_SECRET: "fiap_x_super_secret_jwt_key_2026"
  # Mailtrap — substitua pelos valores reais antes de aplicar no cluster
  # kubectl apply -f k8s/00-configmap-secrets.yaml
  SMTP_HOST: "sandbox.smtp.mailtrap.io"
  SMTP_PORT: "2525"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  SMTP_FROM: "worker@fiap-x.local"
  SMTP_TO: "dev@fiap-x.local"
  