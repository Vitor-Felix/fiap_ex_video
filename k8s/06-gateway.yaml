apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiap-gateway
  template:
    metadata:
      labels:
        app: fiap-gateway
    spec:
      containers:
      - name: gateway
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: fiap-gateway
  ports:
  - port: 8080
    targetPort: 8080
  type: NodePort
  