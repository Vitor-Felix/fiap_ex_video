apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-worker-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiap-worker
  template:
    metadata:
      labels:
        app: fiap-worker
    spec:
      containers:
      - name: worker
        image: fiap-worker:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: fiap-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: DB_PASSWORD
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: RABBITMQ_URL
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: SMTP_HOST
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: SMTP_PORT
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: SMTP_USER
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: SMTP_PASSWORD
        - name: SMTP_FROM
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: SMTP_FROM
        - name: SMTP_TO
          valueFrom:
            secretKeyRef:
              name: fiap-secrets
              key: SMTP_TO
        volumeMounts:
        - name: shared-storage
          mountPath: /app/uploads
          subPath: uploads
        - name: shared-storage
          mountPath: /app/outputs
          subPath: outputs
        - name: shared-storage
          mountPath: /app/temp
          subPath: temp
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-storage-pvc
